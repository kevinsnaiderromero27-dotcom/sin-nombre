<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cautivo - Bienvenido</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Bienvenido a la Red</h2>
            <p>Por favor, ingresa tus datos o presiona el botón para obtener acceso a Internet.</p>
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Nombre de usuario / Correo:</label>
                    <input type="text" id="username" name="username" placeholder="Tu usuario o correo" required>
                </div>
                
                <button type="submit" class="btn">Conectar a Internet</button>
            </form>
        </div>
    </div>
</body>
</html>
